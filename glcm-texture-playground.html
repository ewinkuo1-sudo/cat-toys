<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLCM 紋理分類遊樂場 🐱</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c; --panel: #1d2028; --ink: #e6e6ec; --muted: #9aa0ae;
    --accent: #6ec6ff; --ref: #ffb86c; --grid: #2e3340; --good: #5fd08a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6; --panel: #ffffff; --ink: #1c1f27; --muted: #5b6272;
    --accent: #1e6fc0; --ref: #d4741a; --grid: #dfe2e9; --good: #1f9a55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", serif;
  }
  .page { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  button, select { font-family: inherit; }
  button.chip {
    background: none; color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; cursor: pointer;
    line-height: 1.2; white-space: nowrap; transition: border-color .12s, color .12s, background .12s;
  }
  button.chip:hover { border-color: var(--muted); color: var(--ink); }
  button.chip.on { border-color: var(--accent); color: var(--accent); }
  button.chip.done::after { content: " ✔"; color: var(--good); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .steps button.chip { font-size: 0.9rem; padding: 8px 12px; }
  .steps button.chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .cap { margin: 0; text-align: center; font-size: 1rem; line-height: 1.7; min-height: 1.7em; }
  .cap b { color: var(--accent); } .cap i { color: var(--ref); font-style: normal; font-weight: 700; }
  .box { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  :root[data-theme="light"] .box { box-shadow: 0 1px 3px rgba(20,24,40,0.06); }
  canvas { width: 100%; display: block; }
  #c1, #cS { cursor: pointer; }
  .live { margin: 6px 4px 12px; text-align: center; font-size: 0.95rem; min-height: 1.6em; line-height: 1.6; }
  .live b { color: var(--accent); } .live i { color: var(--ref); font-style: normal; font-weight: 700; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--muted); }
  .duo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile .k { font-size: 0.85rem; color: var(--muted); }
  .tile .v { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; color: var(--good); }
  .tile.bad .v { color: var(--ref); }
  .tile .n { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 24px; align-items: start; }
  .ctl label.sl { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 6px; gap: 8px; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctl .cap2 { font-size: 0.92rem; margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { font-size: 0.88rem; background: var(--panel); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
  .toggle input { accent-color: var(--ref); width: 18px; height: 18px; flex: none; }
  .chal p { margin: 10px 0 0; line-height: 1.7; }
  .chal .status { color: var(--muted); font-size: 0.92rem; }
  .chal .status.ok { color: var(--good); font-weight: 600; }
  details { font-size: 0.86rem; color: var(--muted); line-height: 1.8; }
  details summary { cursor: pointer; color: var(--ink); font-size: 0.9rem; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    body { padding: 12px 12px 32px; }
    .cap { font-size: 0.95rem; text-align: left; }
    .duo { grid-template-columns: 1fr; }
    .tile .v { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<script>
// 先套主題，避免首繪閃白／閃黑（完整邏輯在頁尾）
(() => {
  let th = 'light'; try { th = localStorage.getItem('owl-theme') || th; } catch (e) {}
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') th = q;
  document.documentElement.dataset.theme = th;
})();
</script>
<div class="page">
  <div class="head">
    <h1 data-i18n="title"></h1>
    <button class="chip" id="lang" data-i18n-title="btn.lang.title"></button>
    <button class="chip" id="theme" data-i18n-title="btn.theme.title"></button>
  </div>
  <nav class="steps" id="steps"></nav>
  <p class="cap" id="cap"></p>

  <!-- ① 數一數 -->
  <div class="box" data-steps="1">
    <canvas id="c1"></canvas>
    <p class="live" id="live1"></p>
    <div class="bar">
      <div class="grp"><button class="chip" id="t1play"></button><button class="chip" id="t1step" data-i18n="t1.step"></button><button class="chip" id="t1all" data-i18n="t1.all"></button><button class="chip" id="t1reset" data-i18n="t1.reset"></button></div>
      <div class="grp"><span data-i18n="t1.pattern"></span><span class="grp" id="t1pat"></span></div>
      <div class="grp"><span data-i18n="t1.dir"></span><span class="grp" id="t1dir"></span></div>
    </div>
  </div>

  <!-- ② 讀這張表 -->
  <div class="box" data-steps="2">
    <canvas id="c2"></canvas>
    <p class="live" id="live2"></p>
    <div class="bar">
      <div class="grp"><span class="grp" id="t2src"></span></div>
      <div class="grp"><span data-i18n="t2.dir"></span><span class="grp" id="t2dir"></span></div>
      <div class="grp" style="flex:1 1 220px"><span data-i18n="t2.rot"></span><input type="range" id="t2rot" min="0" max="180" step="5" value="0" style="flex:1"><output id="t2rotOut"></output></div>
    </div>
  </div>

  <!-- ③ 以後：散點＋分類 -->
  <div class="duo" data-steps="3 4 5">
    <div class="box"><canvas id="cS"></canvas></div>
    <div class="box"><canvas id="cD"></canvas></div>
  </div>
  <div class="tiles" data-steps="3 4 5">
    <div class="box tile" id="tileTe"><div class="k" data-i18n="tile.test"></div><div class="v" id="vTe"></div><div class="n" id="nTe"></div></div>
    <div class="box tile" id="tileCv"><div class="k" data-i18n="tile.cv"></div><div class="v" id="vCv"></div><div class="n" id="nCv"></div></div>
  </div>

  <div class="box chal" data-steps="5">
    <div class="bar" id="chalBtns"></div>
    <p id="chalGoal"></p>
    <p class="status" id="chalStatus"></p>
  </div>

  <div class="box controls" data-steps="3 4 5">
    <div class="ctl toggle" data-steps="3 4 5">
      <input type="checkbox" id="rot"><label for="rot" data-i18n="lbl.rot"></label>
    </div>
    <div class="ctl" data-steps="3">
      <div class="cap2" data-i18n="lbl.quick"></div>
      <div class="grp" id="quick"></div>
    </div>
    <div class="ctl" data-steps="4 5">
      <div class="grp"><span data-i18n="lbl.fx"></span> <select id="fx"></select></div>
      <div class="grp" style="margin-top:6px"><span data-i18n="lbl.fy"></span> <select id="fy"></select></div>
    </div>
    <div class="ctl toggle" data-steps="4 5">
      <input type="checkbox" id="all6"><label for="all6" data-i18n="lbl.all6"></label>
    </div>
    <div class="ctl" data-steps="4 5">
      <div class="cap2" data-i18n="lbl.angle"></div>
      <div class="grp" id="angles"></div>
    </div>
    <div class="ctl" data-steps="4 5">
      <label class="sl"><span data-i18n="lbl.dist"></span> <output id="distOut"></output></label>
      <input type="range" id="dist" min="1" max="8" step="1" value="2">
    </div>
    <div class="ctl" data-steps="4 5">
      <label class="sl"><span data-i18n="lbl.diff"></span> <output id="diffOut"></output></label>
      <input type="range" id="diff" min="6" max="70" step="1" value="35">
    </div>
    <div class="ctl" data-steps="4 5">
      <label class="sl"><span data-i18n="lbl.noise"></span> <output id="noiseOut"></output></label>
      <input type="range" id="noise" min="0" max="0.5" step="0.01" value="0.12">
    </div>
    <div class="ctl" data-steps="4 5">
      <div class="grp"><button class="chip" id="reseed" data-i18n="btn.reseed"></button><button class="chip" id="upload" data-i18n="btn.upload"></button></div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <details>
    <summary data-i18n="more.sum"></summary>
    <div data-i18n="more.txt"></div>
  </details>
</div>

  const me = T2.D.per[T2.dir].contrast, mx = Math.max(...cs), mn = Math.min(...cs);
  $('live2').innerHTML = T2.D.f.aniso < 0.2 ? t('l2.iso') : me === mn ? t('l2.along') : me === mx ? t('l2.across') : t('l2.mid');
  $('t2rotOut').textContent = T2.rot + '°';
}
$('t2rot').addEventListener('input', e => { T2.rot = parseInt(e.target.value, 10); if (T2.src === 'up') T2.src = 'A'; t2Build(); buildUI(); draw2(); });

/* ═══════════════════════════ ③ 樣本、特徵、SVM ═══════════════════════════ */
let seed = 20261024, samples = [], sel = 0, angle = 0, model = null, user = null;
function rebuild() {
  const rng = mulberry32(seed);
  const spreadB = parseFloat($('diff').value), noise = parseFloat($('noise').value), rot = $('rot').checked;
  samples = [];
  for (let k = 0; k < 2 * PER; k++) {
    const cls = k % 2;                                         // 0 = A、1 = B，交錯排
    const img = makePatch(rng, cls ? spreadB : SPREAD_A, rot ? rng() * Math.PI : 0, noise);
    samples.push({ cls, img, q: quant(img), train: (k >> 1) % 2 === 0, fold: (k >> 1) % 5 });
  }
  recompute();
}
function recompute() {
  const d = parseInt($('dist').value, 10);
  for (const s of samples) Object.assign(s, describe(s.q, d, angle));
  if (user) Object.assign(user, describe(user.q, d, angle));
  train();
}
// 線性 SVM：用練習那一半算平均與標準差做標準化，再對 hinge loss 做批次次梯度下降
function fit(idx, keys) {
  const D = keys.length, n = idx.length;
  const mu = keys.map(k => idx.reduce((m, i) => m + samples[i].f[k], 0) / n);
  const sd = keys.map((k, c) => Math.sqrt(idx.reduce((m, i) => m + (samples[i].f[k] - mu[c]) ** 2, 0) / n) || 1);
  const Z = idx.map(i => keys.map((k, c) => (samples[i].f[k] - mu[c]) / sd[c])), y = idx.map(i => samples[i].cls ? 1 : -1);
  let w = new Array(D).fill(0), b = 0; const lam = 0.01, lr = 0.1;
  for (let ep = 0; ep < 500; ep++) {
    const gw = w.map(v => lam * v); let gb = 0;
    for (let r = 0; r < n; r++) {
      let m = b; for (let c = 0; c < D; c++) m += w[c] * Z[r][c];
      if (y[r] * m < 1) { for (let c = 0; c < D; c++) gw[c] -= y[r] * Z[r][c] / n; gb -= y[r] / n; }
    }
    w = w.map((v, c) => v - lr * gw[c]); b -= lr * gb;
  }
  return f => { let m = b; for (let c = 0; c < D; c++) m += w[c] * (f[keys[c]] - mu[c]) / sd[c]; return m > 0 ? 1 : 0; };
}
function train() {
  const keys = $('all6').checked ? FEATS : [$('fx').value, $('fy').value];
  const all = samples.map((s, i) => i), tr = all.filter(i => samples[i].train), te = all.filter(i => !samples[i].train);
  const pred = fit(tr, keys);
  samples.forEach(s => { s.pred = pred(s.f); });
  const acc = idx => idx.filter(i => samples[i].pred === samples[i].cls).length / idx.length;
  let cv = 0;
  for (let k = 0; k < 5; k++) {
    const p = fit(all.filter(i => samples[i].fold !== k), keys), held = all.filter(i => samples[i].fold === k);
    cv += held.filter(i => p(samples[i].f) === samples[i].cls).length / held.length / 5;
  }
  if (user) user.pred = pred(user.f);
  model = { pred, keys, accTr: acc(tr), accTe: acc(te), cv, two: keys.length === 2 };
}
const colOf = cls => cls ? C.ref : C.accent;

let scatterMap = [];
function drawS() {
  const r = prep($('cS'), W => Math.min(440, Math.max(300, W * 0.82))); if (!r) return;
  const { ctx, W, H } = r, mL = 52, mR = 12, mT = 48, mB = 42, pw = W - mL - mR, ph = H - mT - mB;
  const fx = $('fx').value, fy = $('fy').value;
  const pts = user ? [...samples, user] : samples;
  const xs = pts.map(s => s.f[fx]), ys = pts.map(s => s.f[fy]);
  const padr = (lo, hi) => { const q = (hi - lo) || 1; return [lo - 0.08 * q, hi + 0.08 * q]; };
  const [xl, xh] = padr(Math.min(...xs), Math.max(...xs)), [yl, yh] = padr(Math.min(...ys), Math.max(...ys));
  const X = v => mL + pw * (v - xl) / (xh - xl), Y = v => mT + ph - ph * (v - yl) / (yh - yl);
  if (model.two && fx !== fy) {                              // 依電腦的判斷把兩邊淡淡上色
    const cell = 6, probe = {};
    for (let py = 0; py < ph; py += cell) for (let px = 0; px < pw; px += cell) {
      probe[fx] = xl + (xh - xl) * (px + cell / 2) / pw; probe[fy] = yh - (yh - yl) * (py + cell / 2) / ph;
      ctx.fillStyle = colOf(model.pred(probe)); ctx.globalAlpha = 0.1;
      ctx.fillRect(mL + px, mT + py, Math.min(cell, pw - px), Math.min(cell, ph - py));
    }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.strokeRect(mL, mT, pw, ph);
  ctx.fillStyle = C.muted; ctx.font = font(11);
  for (let k = 0; k <= 4; k++) {
    const vx = xl + (xh - xl) * k / 4, vy = yl + (yh - yl) * k / 4;
    ctx.textAlign = 'center'; ctx.fillText(vx.toPrecision(2), X(vx), mT + ph + 15);
    ctx.textAlign = 'right'; ctx.fillText(vy.toPrecision(2), mL - 5, Y(vy) + 4);
  }
  ctx.textAlign = 'center'; ctx.font = font(13, true); ctx.fillStyle = C.ink;
  ctx.fillText(t('f.' + fx) + ' →', mL + pw / 2, H - 8);
  ctx.save(); ctx.translate(14, mT + ph / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(t('f.' + fy) + ' →', 0, 0); ctx.restore();
  ctx.textAlign = 'left'; ctx.fillText(t(model.two ? 'cs.title' : 'cs.title6'), 6, 16);
  ctx.font = font(12); ctx.fillStyle = C.muted; ctx.fillText(t('cs.legend') + (user ? '　' + t('cs.you') : ''), 6, 35);
  scatterMap = [];
  samples.forEach((s, i) => {
    const x = X(s.f[fx]), y = Y(s.f[fy]); scatterMap.push([x, y, i]);
    ctx.strokeStyle = ctx.fillStyle = colOf(s.cls); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 2 * Math.PI); s.train ? ctx.fill() : ctx.stroke();
    if (i === sel) { ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, 9, 0, 2 * Math.PI); ctx.stroke(); }
  });
  if (user) {
    const x = X(user.f[fx]), y = Y(user.f[fy]); scatterMap.push([x, y, -1]);
    ctx.fillStyle = C.ink; ctx.font = font(22, true); ctx.textAlign = 'center'; ctx.fillText('★', x, y + 8);
    if (sel === -1) { ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, 14, 0, 2 * Math.PI); ctx.stroke(); }
  }
}
$('cS').addEventListener('click', e => {
  const r = $('cS').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const [px, py, i] of scatterMap) { const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = i; } }
  if (best !== null && bd < 600) { sel = best; drawS(); drawD(); }
});
function drawD() {
  const r = prep($('cD'), W => { const th = Math.min(40, (W - 20) / 6 - 4), ps = Math.min(150, (W - 12) / 2); return 28 + 2 * (th + 22) + 34 + ps + 28; }); if (!r) return;
  const { ctx, W } = r, th = Math.min(40, (W - 20) / 6 - 4), ps = Math.min(150, (W - 12) / 2);
  ctx.font = font(13, true); ctx.fillStyle = C.ink; ctx.fillText(t('cd.groups'), 2, 16);
  let y = 28;
  for (const cls of [0, 1]) {
    ctx.font = font(12); ctx.fillStyle = colOf(cls); ctx.fillText(t(cls ? 'cd.B' : 'cd.A'), 2, y + 12);
    samples.filter(s => s.cls === cls).slice(0, 6).forEach((s, k) => blitPatch(ctx, s.img, 2 + k * (th + 4), y + 18, th));
    y += th + 22;
  }
  const s = sel === -1 && user ? user : samples[Math.max(0, sel)], isUser = s === user;
  y += 24;
  ctx.font = font(13, true); ctx.fillStyle = isUser ? C.ink : colOf(s.cls);
  ctx.fillText(isUser ? t('cd.user', s.pred ? 'B' : 'A') : t('cd.sel', s.cls ? 'B' : 'A', s.pred ? 'B' : 'A', s.pred === s.cls), 2, y);
  y += 10;
  blitPatch(ctx, s.img, 2, y, ps);
  const d = parseInt($('dist').value, 10), [ox, oy] = offsetOf(d, angle === 'avg' ? 0 : angle);
  drawHeat(ctx, glcmOf(s.q, N, LV, ox, oy), LV, W - ps - 2, y, ps);
  if (isUser) { ctx.font = font(11); ctx.fillStyle = C.muted; ctx.fillText(t('cd.note'), 2, y + ps + 18); }
}

/* ═══════════════════════════ 放自己的圖 ═══════════════════════════ */
function pickFile() { $('file').value = ''; $('file').click(); }
$('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const cx = c.getContext('2d'), m = Math.min(im.width, im.height);
    cx.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, N, N);     // 取中央正方形縮成 64×64
    const px = cx.getImageData(0, 0, N, N).data, g = new Float32Array(NP);
    let lo = 1e9, hi = -1e9;
    for (let i = 0; i < NP; i++) { g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]; lo = Math.min(lo, g[i]); hi = Math.max(hi, g[i]); }
    for (let i = 0; i < NP; i++) g[i] = (g[i] - lo) / ((hi - lo) || 1);                 // 亮度拉滿 0–1
    URL.revokeObjectURL(im.src);
    userImg = g; user = { img: g, q: quant(g), cls: -1 };
    T2.src = 'up'; sel = -1;
    t2Build(); recompute(); buildUI(); render();
  };
  im.src = URL.createObjectURL(f);
});
$('upload').onclick = pickFile;

/* ═══════════════════════════ 挑戰 ═══════════════════════════ */
function setDefaults() {
  $('diff').value = 35; $('noise').value = 0.12; $('rot').checked = false; $('dist').value = 2; $('all6').checked = false;
  angle = 0; $('fx').value = 'contrast'; $('fy').value = 'homog'; seed = 20261024;
}
const CH = [
  { set: () => { $('rot').checked = true; }, ok: () => model.accTe >= 0.9 },
  { set: () => { $('noise').value = 0.40; }, ok: () => model.accTe >= 0.9 },
  { set: () => { $('diff').value = 10; }, ok: () => model.accTe >= 0.8 },
];
function startChal(i) { S.chal = i; setDefaults(); CH[i].set(); rebuild(); }

/* ═══════════════════════════ 分步與介面 ═══════════════════════════ */
function buildUI() {
  for (const [id, def] of [['fx', 'contrast'], ['fy', 'homog']]) {
    const el = $(id), cur = el.value || def;
    el.innerHTML = FEATS.map(k => `<option value="${k}">${t('f.' + k)}</option>`).join('');
    el.value = cur;
  }
  chips($('steps'), [1, 2, 3, 4, 5].map(n => [n, t('step.' + n)]), S.step, v => setStep(parseInt(v, 10)));
  chips($('t1pat'), ['h', 'v', 'd', 'n'].map(p => [p, t('pat.' + p)]), T1.pat, v => { t1Pattern(v); buildUI(); draw1(); });
  chips($('t1dir'), DIR1.map((d, i) => [i, d.s + '︎']), T1.dir, v => { T1.dir = parseInt(v, 10); t1Restart(); buildUI(); draw1(); });
  chips($('t2src'), [['A', t('src.A')], ['B', t('src.B')], ['up', t('src.up')]], T2.src, v => {
    if (v === 'up') { pickFile(); return; }
    T2.src = v; t2Build(); buildUI(); draw2();
  });
  chips($('t2dir'), ANG.map(a => [a, ANG_SYM[a] + '︎']), T2.dir, v => { T2.dir = parseInt(v, 10); t2Build(); buildUI(); draw2(); });
  chips($('quick'), [['contrast', t('q.contrast')], ['aniso', t('q.aniso')]], $('fx').value, v => { $('fx').value = v; train(); buildUI(); render(); });
  chips($('angles'), [...ANG.map(a => [a, ANG_SYM[a] + '︎']), ['avg', t('ang.avg')]], angle, v => { angle = v === 'avg' ? 'avg' : parseInt(v, 10); recompute(); buildUI(); render(); });
  chips($('chalBtns'), CH.map((c, i) => [i, t('chal.' + (i + 1))]), S.chal, v => { startChal(parseInt(v, 10)); buildUI(); render(); });
  $('chalBtns').querySelectorAll('button').forEach((b, i) => b.classList.toggle('done', S.done[i]));
}
function setStep(n, keep) {
  S.step = n;
  if (!keep) {
    if (n === 1) t1Restart();
    if (n === 3) { setDefaults(); rebuild(); }
    if (n === 5) startChal(S.chal);
  }
  document.querySelectorAll('[data-steps]').forEach(el => { el.hidden = !el.dataset.steps.split(' ').includes(String(n)); });
  buildUI(); render();
}
function render() {
  $('cap').innerHTML = t('cap.' + S.step);
  if (S.step === 1) draw1();
  else if (S.step === 2) { t2Build(); draw2(); }
  else {
    $('diffOut').textContent = '±' + $('diff').value + '°';
    $('noiseOut').textContent = parseFloat($('noise').value).toFixed(2);
    $('distOut').textContent = $('dist').value + ' px';
    drawS(); drawD();
    $('vTe').textContent = pct(model.accTe); $('vCv').textContent = pct(model.cv);
    $('tileTe').classList.toggle('bad', model.accTe < 0.85); $('tileCv').classList.toggle('bad', model.cv < 0.85);
    $('nTe').textContent = t('n.train', pct(model.accTr)) + '　' + (model.accTr >= 0.85 && model.accTr - model.accTe > 0.15 ? t('n.gap') : model.accTe >= 0.85 ? t('n.good') : t('n.meh'));
    $('nCv').textContent = t('n.cv');
    if (S.step === 5) {
      const ok = CH[S.chal].ok();
      if (ok && !S.done[S.chal]) { S.done[S.chal] = true; $('chalBtns').querySelectorAll('button')[S.chal].classList.add('done'); }
      $('chalGoal').textContent = t('goal.' + (S.chal + 1));
      $('chalStatus').textContent = ok ? t('chal.ok') : t('chal.no', pct(model.accTe));
      $('chalStatus').classList.toggle('ok', ok);
    }
  }
}

/* ═══════════════════════════ 事件 ═══════════════════════════ */
for (const id of ['diff', 'noise']) $(id).addEventListener('input', () => { rebuild(); render(); });
$('rot').addEventListener('change', () => { rebuild(); render(); });
$('dist').addEventListener('input', () => { recompute(); render(); });
$('fx').addEventListener('change', () => { train(); buildUI(); render(); });
$('fy').addEventListener('change', () => { train(); render(); });
$('all6').addEventListener('change', () => { train(); render(); });
$('reseed').onclick = () => { seed = (seed * 1103515245 + 12345) >>> 0; rebuild(); render(); };
window.addEventListener('resize', () => { if (booted) render(); });

let last = 0;
function tick(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  if (S.step === 1 && T1.playing) {
    const n = t1Pairs().length;
    T1.acc += dt;
    if (T1.acc > 0.28 && T1.k < n) { T1.acc = 0; T1.k++; draw1(); }
    if (T1.k >= n) { T1.playing = false; draw1(); }
  }
  requestAnimationFrame(tick);
}

/* ═══════════════════════════ 開機 ═══════════════════════════ */
readColors();
buildUI();                                                   // 先把下拉選單填好，才能 rebuild
// 網址參數（分享或截圖用）：step、rot、fx、fy、ang、noise、diff、d、all6、k、pat、dir、src
if (QS.get('rot') === '1') $('rot').checked = true;
if (FEATS.includes(QS.get('fx'))) $('fx').value = QS.get('fx');
if (FEATS.includes(QS.get('fy'))) $('fy').value = QS.get('fy');
if (QS.get('ang')) angle = QS.get('ang') === 'avg' ? 'avg' : (ANG.includes(parseInt(QS.get('ang'), 10)) ? parseInt(QS.get('ang'), 10) : 0);
for (const [q, id] of [['noise', 'noise'], ['diff', 'diff'], ['d', 'dist']]) if (QS.get(q) !== null) $(id).value = QS.get(q);
if (QS.get('all6') === '1') $('all6').checked = true;
t1Pattern(['h', 'v', 'd', 'n'].includes(QS.get('pat')) ? QS.get('pat') : 'h');
if (QS.get('dir') !== null) T1.dir = clamp(parseInt(QS.get('dir'), 10) || 0, 0, 3);
if (QS.get('k') !== null) { T1.k = clamp(parseInt(QS.get('k'), 10) || 0, 0, t1Pairs().length); T1.playing = false; }
if (QS.get('src') === 'B') T2.src = 'B';
if (QS.get('trot') !== null) { T2.rot = clamp(parseInt(QS.get('trot'), 10) || 0, 0, 180); $('t2rot').value = T2.rot; }
rebuild();
booted = true;
setTheme(document.documentElement.dataset.theme || 'light');
applyLang();
{ const n = clamp(parseInt(QS.get('step'), 10) || 1, 1, 5); setStep(n, n !== 5); }
requestAnimationFrame(tick);
// 思源宋體是網路字型：載完後重畫一次，讓圖上的字也換成宋體
document.fonts && document.fonts.ready.then(() => { if (booted) render(); });
</script>
