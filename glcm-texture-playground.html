    display: flex; flex-direction: column; align-items: center; gap: 16px;

  .head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  button.chip {
    background: none; color: var(--muted); border: 1px solid var(--grid);

  .controls {

    flex: 1 1 280px; max-width: 360px;

<script>
const $ = id => document.getElementById(id);

// ═══════════════════════════ 文字字典 / Strings ═══════════════════════════
const I18N = {

  'hint': `玩法：先維持預設，看「對比」把兩組分開（沿纖維走、亮度變化小；斜著走、變化大）。
    接著勾「整體方向隨機」：單一方向的對比會被組織擺的方向打亂，測試準確率往下掉。

},

  'theme.light': '☀ Light', 'theme.dark': '🌙 Dark',
  'sub': `A computer can't "see" whether fibers are tidy; the image first has to become numbers. The <b>grey-level co-occurrence matrix (GLCM)</b> counts

    and a <b>support vector machine (SVM)</b> draws a dividing line in feature space. All images here are synthetic tissue: group A has aligned fibers, group B disordered ones. They do not represent any real pathology or published data.`,
  'lbl.diff': 'Group B fiber disorder',

  'cv.gallery': 'Samples (first 8 per group)',

  'cv.arrow': 'arrow ×3',
  'cv.glcm': 'GLCM (8 grey levels, colour = fraction)',
  'cv.i': 'grey level i (here)', 'cv.j': 'grey level j (there)',
  'st.sel': (g, c) => `Selected: group <b>${g}</b>, SVM says <b>${c}</b>`,
  'st.feat': (a, va, b, vb) => `${a}: <b>${va}</b>   ${b}: <b>${vb}</b>`,
  'st.acc': (tr, te) => `Train accuracy <b>${tr}</b>   test accuracy <b>${te}</b>`,

};
let LANG = 'zh';
const t = (k, ...a) => { const v = (I18N[LANG][k] ?? I18N.zh[k]); return typeof v === 'function' ? v(...a) : (v ?? k); };

// ═══════════════════════════ 主題 / Theme ═══════════════════════════
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const C = {};
function readColors() {
  const map = { ink: '--ink', muted: '--muted', accent: '--accent', ref: '--ref', grid: '--grid', panel: '--panel' };
  for (const k in map) C[k] = css(map[k]);
}
let booted = false;
function redrawAll() { if (booted) { fillSelects(); render(); } }
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('owl-theme', th); } catch (e) {}
  $('theme').textContent = th === 'dark' ? t('theme.light') : t('theme.dark');
  readColors();
  redrawAll();
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ═══════════════════════════ 語言 / Language ═══════════════════════════
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-TW';
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $('lang').textContent = LANG === 'en' ? '中文' : 'EN';
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? t('theme.light') : t('theme.dark');
  redrawAll();
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'zh';
  try { localStorage.setItem('owl-lang', LANG); } catch (e) {}
  applyLang();
}
(() => {
  let l = 'zh'; try { l = localStorage.getItem('owl-lang') || l; } catch (e) {}
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') l = q;
  LANG = l;
})();
$('lang').onclick = () => setLang(LANG === 'en' ? 'zh' : 'en');

/* ---------- 亂數（固定種子） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randn(rng) {
  const u = Math.max(1e-12, rng()), v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ---------- 合成組織：一塊 64×64，由 22 條纖維疊成 ---------- */
const N = 64, NP = N * N, LV = 8, PER = 40;          // 每組 40 塊
const SPREAD_A = 6;                                   // A 組方向標準差（度）
function makePatch(rng, spreadDeg, theta0, noise) {
  const g = new Float32Array(NP).fill(0.08);
  for (let f = 0; f < 22; f++) {
    const th = theta0 + spreadDeg * Math.PI / 180 * randn(rng);
    const cx = rng() * N, cy = rng() * N, half = 14 + rng() * 18;
    const ux = Math.cos(th), uy = Math.sin(th), amp = 0.28 + 0.27 * rng(), sw = 1.1 + 0.6 * rng();
    const x0 = Math.max(0, Math.floor(Math.min(cx - ux * half, cx + ux * half) - 4)), x1 = Math.min(N - 1, Math.ceil(Math.max(cx - ux * half, cx + ux * half) + 4));
    const y0 = Math.max(0, Math.floor(Math.min(cy - uy * half, cy + uy * half) - 4)), y1 = Math.min(N - 1, Math.ceil(Math.max(cy - uy * half, cy + uy * half) + 4));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x - cx, dy = y - cy;
      const s = Math.max(-half, Math.min(half, dx * ux + dy * uy));
      const px = dx - s * ux, py = dy - s * uy;
      g[y * N + x] += amp * Math.exp(-(px * px + py * py) / (2 * sw * sw));
    }
  }
  for (let i = 0; i < NP; i++) g[i] = Math.max(0, Math.min(1, g[i] + noise * randn(rng)));
  return g;
}
const quant = g => { const q = new Uint8Array(NP); for (let i = 0; i < NP; i++) q[i] = Math.min(LV - 1, Math.floor(g[i] * LV)); return q; };

/* ---------- GLCM 與特徵 ---------- */
const ANG = [0, 45, 90, 135];
function offsetOf(d, a) {           // 影像 y 往下，角度逆時針
  return { 0: [d, 0], 45: [d, -d], 90: [0, -d], 135: [-d, -d] }[a];
}
function glcm(q, d, a) {
  const [ox, oy] = offsetOf(d, a), P = new Float64Array(LV * LV);
  let n = 0;
  for (let y = 0; y < N; y++) {
    const yy = y + oy; if (yy < 0 || yy >= N) continue;
    for (let x = 0; x < N; x++) {
      const xx = x + ox; if (xx < 0 || xx >= N) continue;
      const i = q[y * N + x], j = q[yy * N + xx];
      P[i * LV + j]++; P[j * LV + i]++; n += 2;       // 對稱
    }
  }
  for (let k = 0; k < P.length; k++) P[k] /= n;
  return P;
}
function feats(P) {
  let con = 0, hom = 0, asm = 0, ent = 0, mi = 0, mj = 0;
  for (let i = 0; i < LV; i++) for (let j = 0; j < LV; j++) {
    const p = P[i * LV + j];
    con += (i - j) ** 2 * p; hom += p / (1 + (i - j) ** 2); asm += p * p;
    if (p > 0) ent -= p * Math.log2(p);
    mi += i * p; mj += j * p;
  }
  let si = 0, sj = 0, cov = 0;
  for (let i = 0; i < LV; i++) for (let j = 0; j < LV; j++) {
    const p = P[i * LV + j]; si += (i - mi) ** 2 * p; sj += (j - mj) ** 2 * p; cov += (i - mi) * (j - mj) * p;
  }
  return { contrast: con, homog: hom, energy: Math.sqrt(asm), corr: cov / Math.sqrt(si * sj + 1e-12), entropy: ent };
}
const FEATS = ['contrast', 'homog', 'energy', 'corr', 'entropy', 'aniso'];

/* ---------- 狀態 ---------- */
let seed = 20261024, samples = [], sel = 0, angle = 0, model = null;
function getAngleSet() { return angle === 'avg' ? ANG : [angle]; }

function rebuild() {
  const rng = mulberry32(seed);
  const spreadB = parseFloat($('diff').value), noise = parseFloat($('noise').value), rot = $('rot').checked;
  samples = [];
  for (let k = 0; k < 2 * PER; k++) {
    const cls = k % 2;                                         // 0 = A、1 = B，交錯排
    const th0 = rot ? rng() * Math.PI : 0;
    const img = makePatch(rng, cls ? spreadB : SPREAD_A, th0, noise);
    samples.push({ cls, img, q: quant(img), train: (k >> 1) % 2 === 0 });
  }
  recompute();
}
function recompute() {
  const d = parseInt($('dist').value, 10), set = getAngleSet();
  for (const s of samples) {
    const per = ANG.map(a => ({ a, f: feats(glcm(s.q, d, a)) }));
    const use = per.filter(p => set.includes(p.a));
    const f = {};
    for (const k of FEATS.slice(0, 5)) f[k] = use.reduce((m, p) => m + p.f[k], 0) / use.length;
    const cs = per.map(p => p.f.contrast), mx = Math.max(...cs), mn = Math.min(...cs);
    f.aniso = (mx - mn) / (mx + mn + 1e-9);
    s.f = f; s.P = glcm(s.q, d, set[0]);
  }
  train();
}

/* ---------- 線性 SVM：標準化後對 hinge loss 做批次次梯度下降 ---------- */
function train() {
  const fx = $('fx').value, fy = $('fy').value;
  const xs = samples.map(s => [s.f[fx], s.f[fy]]);
  const mu = [0, 1].map(k => xs.reduce((m, v) => m + v[k], 0) / xs.length);
  const sd = [0, 1].map(k => Math.sqrt(xs.reduce((m, v) => m + (v[k] - mu[k]) ** 2, 0) / xs.length) || 1);
  const Z = xs.map(v => [(v[0] - mu[0]) / sd[0], (v[1] - mu[1]) / sd[1]]);
  const tr = samples.map((s, i) => i).filter(i => samples[i].train);
  let w = [0, 0], b = 0;
  const lam = 0.01, lr = 0.1;
  for (let ep = 0; ep < 500; ep++) {
    let gw = [lam * w[0], lam * w[1]], gb = 0;
    for (const i of tr) {
      const y = samples[i].cls ? 1 : -1;
      if (y * (w[0] * Z[i][0] + w[1] * Z[i][1] + b) < 1) { gw[0] -= y * Z[i][0] / tr.length; gw[1] -= y * Z[i][1] / tr.length; gb -= y / tr.length; }
    }
    w = [w[0] - lr * gw[0], w[1] - lr * gw[1]]; b -= lr * gb;
  }
  const pred = (x, y) => (w[0] * (x - mu[0]) / sd[0] + w[1] * (y - mu[1]) / sd[1] + b) > 0 ? 1 : 0;
  let okTr = 0, nTr = 0, okTe = 0, nTe = 0;
  samples.forEach((s, i) => {
    s.pred = pred(xs[i][0], xs[i][1]);
    if (s.train) { nTr++; okTr += s.pred === s.cls; } else { nTe++; okTe += s.pred === s.cls; }
  });
  model = { pred, accTr: okTr / nTr, accTe: okTe / nTe };
}

/* ---------- 顏色 ---------- */
const colA = () => C.accent, colB = () => C.ref;
const font = s => `${s}px "Noto Serif TC", "Source Han Serif TC", serif`;
const off = document.createElement('canvas'); off.width = N; off.height = N;
const octx = off.getContext('2d'), oimg = octx.createImageData(N, N);
function blitPatch(ctx, img, x, y, size) {
  const d = oimg.data;
  for (let i = 0; i < NP; i++) { const c = Math.round(img[i] * 255); d[i * 4] = c; d[i * 4 + 1] = c; d[i * 4 + 2] = c; d[i * 4 + 3] = 255; }
  octx.putImageData(oimg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, x, y, size, size);
}

/* ---------- 樣本牆 ---------- */
function drawGallery() {
  const cv = $('cGallery'), ctx = cv.getContext('2d');
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = C.ink; ctx.font = font(13); ctx.fillText(t('cv.gallery'), 12, 18);
  ctx.font = font(12);
  const x0 = 20 + Math.max(ctx.measureText(t('cv.A')).width, ctx.measureText(t('cv.B')).width);
  const sz = Math.min(38, Math.floor((cv.width - x0 - 10) / 8) - 4);   // 標籤寬度依語言不同，縮圖跟著縮
  for (const cls of [0, 1]) {
    const y = 30 + cls * (sz + 12);
    ctx.fillStyle = cls ? colB() : colA(); ctx.font = font(12);
    ctx.fillText(t(cls ? 'cv.B' : 'cv.A'), 12, y + sz / 2 + 4);
    samples.filter(s => s.cls === cls).slice(0, 8).forEach((s, k) => {
      blitPatch(ctx, s.img, x0 + k * (sz + 4), y, sz);
      if (samples.indexOf(s) === sel) { ctx.strokeStyle = cls ? colB() : colA(); ctx.lineWidth = 2; ctx.strokeRect(x0 + k * (sz + 4) - 1, y - 1, sz + 2, sz + 2); }
    });
  }
}

/* ---------- 特徵散點 ---------- */
let scatterMap = null;
function drawScatter() {
  const cv = $('cScatter'), ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height, mL = 50, mR = 14, mT = 40, mB = 44;
  const pw = w - mL - mR, ph = h - mT - mB;
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, w, h);
  const fx = $('fx').value, fy = $('fy').value;
  const xs = samples.map(s => s.f[fx]), ys = samples.map(s => s.f[fy]);
  const pad = (lo, hi) => { const r = (hi - lo) || 1; return [lo - 0.08 * r, hi + 0.08 * r]; };
  const [xl, xh] = pad(Math.min(...xs), Math.max(...xs)), [yl, yh] = pad(Math.min(...ys), Math.max(...ys));
  const X = v => mL + pw * (v - xl) / (xh - xl), Y = v => mT + ph - ph * (v - yl) / (yh - yl);
  // 分界：依預測類別把背景淡淡上色
  const cell = 6;
  for (let py = 0; py < ph; py += cell) for (let px = 0; px < pw; px += cell) {
    const vx = xl + (xh - xl) * (px + cell / 2) / pw, vy = yh - (yh - yl) * (py + cell / 2) / ph;
    ctx.fillStyle = model.pred(vx, vy) ? colB() : colA();
    ctx.globalAlpha = 0.09; ctx.fillRect(mL + px, mT + py, cell, cell);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = C.grid; ctx.strokeRect(mL, mT, pw, ph);
  ctx.fillStyle = C.muted; ctx.font = font(10);
  for (let k = 0; k <= 4; k++) {
    const vx = xl + (xh - xl) * k / 4, vy = yl + (yh - yl) * k / 4;
    ctx.textAlign = 'center'; ctx.fillText(vx.toPrecision(3), X(vx), mT + ph + 14);
    ctx.textAlign = 'right'; ctx.fillText(vy.toPrecision(3), mL - 4, Y(vy) + 3);
  }
  ctx.textAlign = 'center'; ctx.font = font(11); ctx.fillStyle = C.ink;
  ctx.fillText(t('f.' + fx), mL + pw / 2, h - 10);
  ctx.save(); ctx.translate(12, mT + ph / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(t('f.' + fy), 0, 0); ctx.restore();
  ctx.textAlign = 'left'; ctx.font = font(13); ctx.fillText(t('cv.scatter'), 12, 18);
  ctx.font = font(10); ctx.fillStyle = C.muted; ctx.fillText(t('cv.click') + '　' + t('cv.train') + '　' + t('cv.test'), 12, 33);
  scatterMap = [];
  samples.forEach((s, i) => {
    const x = X(s.f[fx]), y = Y(s.f[fy]);
    scatterMap.push([x, y, i]);
    ctx.strokeStyle = ctx.fillStyle = s.cls ? colB() : colA(); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, 4.2, 0, 2 * Math.PI);
    s.train ? ctx.fill() : ctx.stroke();
    if (i === sel) { ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 8, 0, 2 * Math.PI); ctx.stroke(); }
  });
}
$('cScatter').addEventListener('click', e => {
  const cv = $('cScatter'), r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  let best = -1, bd = 1e9;
  for (const [px, py, i] of scatterMap) { const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = i; } }
  if (best >= 0 && bd < 400) { sel = best; render(); }
});

/* ---------- 選中的那塊＋它的 GLCM ---------- */
function drawPatch() {
  const cv = $('cPatch'), ctx = cv.getContext('2d'), s = samples[sel];
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, cv.width, cv.height);
  blitPatch(ctx, s.img, 0, 26, 256);
  ctx.fillStyle = s.cls ? colB() : colA(); ctx.font = font(12);
  ctx.fillText(t(s.cls ? 'cv.B' : 'cv.A') + ' · ' + t('cv.patch', sel + 1), 10, 17);
  // 位移箭頭（影像本身放大 4 倍，箭頭再放大 3 倍才看得到）
  const d = parseInt($('dist').value, 10), set = getAngleSet();
  ctx.strokeStyle = '#ffd34d'; ctx.fillStyle = '#ffd34d'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 3;
  for (const a of set) {
    const [ox, oy] = offsetOf(d, a), sc = 12, cx = 128, cy = 26 + 128;
    const ex = cx + ox * sc, ey = cy + oy * sc;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
    const ang = Math.atan2(ey - cy, ex - cx);
    ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex - 7 * Math.cos(ang - 0.4), ey - 7 * Math.sin(ang - 0.4));
    ctx.lineTo(ex - 7 * Math.cos(ang + 0.4), ey - 7 * Math.sin(ang + 0.4)); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.muted; ctx.font = font(10); ctx.textAlign = 'right'; ctx.fillText(t('cv.arrow'), 248, 17); ctx.textAlign = 'left';
}
function drawGlcm() {
  const cv = $('cGlcm'), ctx = cv.getContext('2d'), P = samples[sel].P;
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = C.ink; ctx.font = font(12); ctx.fillText(t('cv.glcm'), 10, 17);
  const x0 = 34, y0 = 34, sz = 26;
  let mx = 0; for (const p of P) mx = Math.max(mx, p);
  for (let i = 0; i < LV; i++) for (let j = 0; j < LV; j++) {
    const v = Math.sqrt(P[i * LV + j] / mx);                // √ 讓小值也看得到
    ctx.fillStyle = `hsl(${210 - 180 * v}, 70%, ${92 - 50 * v}%)`;
    ctx.fillRect(x0 + j * sz, y0 + i * sz, sz - 1, sz - 1);
  }
  ctx.strokeStyle = C.muted; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + LV * sz, y0 + LV * sz); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.muted; ctx.font = font(10);
  ctx.textAlign = 'center'; ctx.fillText(t('cv.j') + ' →', x0 + LV * sz / 2, y0 + LV * sz + 16);
  ctx.save(); ctx.translate(14, y0 + LV * sz / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(t('cv.i') + ' →', 0, 0); ctx.restore();
  ctx.textAlign = 'left';
}

/* ---------- 選單 ---------- */
function fillSelects() {
  for (const [id, def] of [['fx', 'contrast'], ['fy', 'homog']]) {
    const el = $(id), cur = el.value || def;
    el.innerHTML = FEATS.map(k => `<option value="${k}">${t('f.' + k)}</option>`).join('');
    el.value = cur;
  }
  $('angles').innerHTML = [...ANG, 'avg'].map(a => `<button class="chip${a === angle ? ' on' : ''}" data-a="${a}">${a === 'avg' ? t('ang.avg') : a + '°'}</button>`).join('');
  $('angles').querySelectorAll('button').forEach(b => b.onclick = () => {
    angle = b.dataset.a === 'avg' ? 'avg' : parseInt(b.dataset.a, 10);
    fillSelects(); recompute(); render();
  });
}

/* ---------- 總繪製 ---------- */
function render() {
  $('diffOut').textContent = '±' + $('diff').value + '°（A ±' + SPREAD_A + '°）';
  $('noiseOut').textContent = parseFloat($('noise').value).toFixed(2);
  $('distOut').textContent = $('dist').value + ' px';
  drawGallery(); drawScatter(); drawPatch(); drawGlcm();
  const s = samples[sel], fx = $('fx').value, fy = $('fy').value;
  const pct = v => (v * 100).toFixed(0) + '%';
  let verdict = model.accTe >= 0.85 ? t('st.good') : t('st.meh');
  if (model.accTr - model.accTe > 0.15) verdict = t('st.gap');
  $('stats').innerHTML =
    t('st.sel', s.cls ? 'B' : 'A', s.pred ? 'B' : 'A') + '<br>' +
    t('st.feat', t('f.' + fx), s.f[fx].toFixed(3), t('f.' + fy), s.f[fy].toFixed(3)) + '<br>' +
    t('st.acc', pct(model.accTr), pct(model.accTe)) + '<br>' + verdict;
}

/* ---------- 事件 ---------- */
for (const id of ['diff', 'noise']) $(id).addEventListener('input', () => { rebuild(); render(); });
$('rot').addEventListener('change', () => { rebuild(); render(); });
$('dist').addEventListener('input', () => { recompute(); render(); });
$('fx').addEventListener('change', () => { train(); render(); });
$('fy').addEventListener('change', () => { train(); render(); });
$('reseed').onclick = () => { seed = (seed * 1103515245 + 12345) >>> 0; rebuild(); render(); };

readColors();
fillSelects();
rebuild();
booted = true;
setTheme(document.documentElement.dataset.theme || 'light');
applyLang();
</script>
<script>
// 思源宋體（Noto Serif TC）是網路字型：載完後重畫一次 canvas，讓圖上的字也換成宋體
document.fonts && document.fonts.ready.then(() => {
  if (typeof redrawAll === 'function') redrawAll(); else if (typeof render === 'function') render();
});
</script>
</body>
