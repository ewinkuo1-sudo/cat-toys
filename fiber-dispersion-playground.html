<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光纖脈衝變寬遊樂場 🐱</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c; --panel: #1d2028; --ink: #e6e6ec; --muted: #9aa0ae;
    --accent: #6ec6ff; --ref: #ffb86c; --grid: #2e3340;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6; --panel: #ffffff; --ink: #1c1f27; --muted: #5b6272;
    --accent: #1e6fc0; --ref: #d4741a; --grid: #dfe2e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  button.chip {
    background: none; color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2; transition: border-color .12s, color .12s;
  }
  button.chip:hover { border-color: var(--muted); color: var(--ink); }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 760px; text-align: center; line-height: 1.6; }
  .sub b { color: var(--ink); }
  .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; }
  .plots { display: flex; flex-direction: column; gap: 16px; max-width: 100%; }
  canvas { background: var(--panel); border-radius: 12px; max-width: 100%; height: auto; display: block; }
  .controls {
    background: var(--panel); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 18px; min-width: 280px;
    flex: 1 1 280px; max-width: 380px;
  }
  :root[data-theme="light"] canvas, :root[data-theme="light"] .controls { box-shadow: 0 1px 3px rgba(20,24,40,0.06); }
  .ctl label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; gap: 8px; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .toggle input { accent-color: var(--ref); }
  .stats { font-size: 0.85rem; color: var(--muted); line-height: 1.8; border-top: 1px solid var(--grid); padding-top: 12px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats .warn { color: var(--ref); }
  .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--grid); padding-top: 12px; }
  @media (max-width: 520px) {
    body { padding: 12px; }
    .controls { width: 100%; max-width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
<script>
// 先套主題，避免首繪閃白／閃黑（完整邏輯在頁尾）
(() => {
  let th = 'light'; try { th = localStorage.getItem('owl-theme') || th; } catch (e) {}
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') th = q;
  document.documentElement.dataset.theme = th;
})();
</script>
<div class="head">
  <h1 data-i18n="title"></h1>
  <button class="chip" id="lang" data-i18n-title="btn.lang.title"></button>
  <button class="chip" id="theme" data-i18n-title="btn.theme.title"></button>
</div>
<p class="sub" data-i18n="sub"></p>
<div class="wrap">
  <div class="plots">
    <canvas id="cPulse" width="600" height="300"></canvas>
    <canvas id="cCurve" width="600" height="260"></canvas>
  </div>
  <div class="controls">
    <div class="ctl">
      <label><span data-i18n="lbl.tau"></span> <output id="tauOut"></output></label>
      <input type="range" id="tau" min="30" max="500" step="5" value="100">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.lam"></span> <output id="lamOut"></output></label>
      <input type="range" id="lam" min="700" max="1100" step="10" value="800">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.len"></span> <output id="lenOut"></output></label>
      <input type="range" id="len" min="0" max="4" step="0.01" value="3">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.pre"></span> <output id="preOut"></output></label>
      <input type="range" id="pre" min="-150000" max="0" step="100" value="0">
    </div>
    <div class="row">
      <button class="chip" id="match" data-i18n="btn.match"></button>
      <button class="chip" id="zero" data-i18n="btn.zero"></button>
    </div>
    <div class="toggle">
      <input type="checkbox" id="carrier" checked>
      <label for="carrier" data-i18n="lbl.carrier"></label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);

// ═══════════════════════════ 文字字典 / Strings ═══════════════════════════
const I18N = {
zh: {
  'title': '光纖脈衝變寬遊樂場',
  'doc.title': '光纖脈衝變寬遊樂場 🐱',
  'btn.lang.title': 'Switch to English',
  'btn.theme.title': '切換深色／淺色',
  'theme.light': '☀ 淺色', 'theme.dark': '🌙 深色',
  'sub': `飛秒脈衝不是單一顏色，而是一小段光譜。玻璃裡<b>紅光跑得比藍光快</b>（正常群速色散），
    走過一段光纖後，紅光跑到前面、藍光落後，脈衝就被拉長。雙光子螢光和 SHG 的訊號跟峰值功率有關：
    平均功率不變時，<b>脈衝拉長幾倍，訊號就掉成幾分之一</b>。微型探頭要靠光纖送光，這是它最先碰到的難題之一。`,
  'lbl.tau': '雷射原始脈寬（FWHM）',
  'lbl.lam': '中心波長',
  'lbl.len': '光纖長度',
  'lbl.pre': '預補償（負色散 GDD）',
  'btn.match': '剛好補償這段光纖',
  'btn.zero': '拿掉預補償',
  'lbl.carrier': '畫出載波（示意：週期放大、只看紅前藍後的趨勢）',
  'hint': `玩法：先把光纖拉到 1 m，看脈衝變寬、訊號掉多少；再按「剛好補償」，等於在進光纖前先讓藍光跑前面，
    走完光纖剛好追平。脈寬越短，掉得越兇（拉長的長度跟原始脈寬平方成反比）。
    <br>簡化：只算熔融石英的材料色散（Sellmeier），忽略光纖的波導色散、三階色散，
    以及高峰值功率下的自相位調變（SPM）；後者在實心光纖裡常是真正的限制，所以實際探頭也會改用特殊光纖。`,
  'cv.pulse': '光強度 vs 時間',
  'cv.in': '進光纖前',
  'cv.out': '出光纖後',
  'cv.time': t => `時間（fs，視窗 ±${t}）`,
  'cv.curve': '出口脈寬 與 雙光子訊號 vs 光纖長度',
  'cv.width': '出口脈寬（fs，對數）',
  'cv.sig': '雙光子訊號（相對）',
  'cv.nocomp': '虛線：沒有預補償',
  'cv.red': '紅（低頻）', 'cv.blue': '藍（高頻）',
  'st.b2': v => `熔融石英 β₂：<b>${v}</b> fs²/mm`,
  'st.gdd': (f, n) => `光纖 GDD：<b>${f}</b> fs²　淨 GDD：<b>${n}</b> fs²`,
  'st.ld': v => `色散長度 L<sub>D</sub>（脈寬變 √2 倍的長度）：<b>${v}</b>`,
  'st.out': (v, k) => `出口脈寬：<b>${v}</b>（${k} 倍）`,
  'st.sig': v => `雙光子／SHG 訊號：剩 <b>${v}</b>（同平均功率）`,
  'st.warn': '<span class="warn">⚠ 訊號掉到一成以下：要補償，或換光纖</span>',
},
en: {
  'title': 'Fiber Pulse-Broadening Playground',
  'doc.title': 'Fiber Pulse-Broadening Playground 🐱',
  'btn.lang.title': '切換為中文',
  'btn.theme.title': 'Toggle dark / light',
  'theme.light': '☀ Light', 'theme.dark': '🌙 Dark',
  'sub': `A femtosecond pulse is not one colour but a small slice of spectrum. In glass <b>red travels faster than blue</b> (normal group-velocity dispersion),
    so after a length of fiber the red runs ahead, the blue lags, and the pulse is stretched. Two-photon fluorescence and SHG depend on peak power:
    at the same average power, <b>a pulse N times longer gives N times less signal</b>. A miniature probe has to deliver light through fiber, so this is one of the first problems it meets.`,
  'lbl.tau': 'Laser pulse width (FWHM)',
  'lbl.lam': 'Centre wavelength',
  'lbl.len': 'Fiber length',
  'lbl.pre': 'Pre-compensation (negative GDD)',
  'btn.match': 'Exactly cancel this fiber',
  'btn.zero': 'Remove pre-compensation',
  'lbl.carrier': 'Draw the carrier (schematic: period enlarged, shows red-first / blue-last only)',
  'hint': `How to play: stretch the fiber to 1 m and watch the pulse widen and the signal drop; then press "Exactly cancel", which sends the blue ahead before the fiber
    so the red catches up exactly at the far end. Shorter pulses suffer more (the stretching length scales with the pulse width squared).
    <br>Simplified: only the material dispersion of fused silica (Sellmeier) is computed; fiber waveguide dispersion, third-order dispersion
    and self-phase modulation (SPM) at high peak power are ignored. SPM is often the real limit in solid-core fiber, which is why real probes also turn to special fibers.`,
  'cv.pulse': 'Intensity vs time',
  'cv.in': 'Before fiber',
  'cv.out': 'After fiber',
  'cv.time': t => `time (fs, window ±${t})`,
  'cv.curve': 'Output pulse width and two-photon signal vs fiber length',
  'cv.width': 'output width (fs, log)',
  'cv.sig': 'two-photon signal (relative)',
  'cv.nocomp': 'dashed: no pre-compensation',
  'cv.red': 'red (low freq.)', 'cv.blue': 'blue (high freq.)',
  'st.b2': v => `Fused-silica β₂: <b>${v}</b> fs²/mm`,
  'st.gdd': (f, n) => `Fiber GDD: <b>${f}</b> fs²   net GDD: <b>${n}</b> fs²`,
  'st.ld': v => `Dispersion length L<sub>D</sub> (width grows √2×): <b>${v}</b>`,
  'st.out': (v, k) => `Output width: <b>${v}</b> (${k}×)`,
  'st.sig': v => `Two-photon / SHG signal: <b>${v}</b> left (same average power)`,
  'st.warn': '<span class="warn">⚠ Signal below 10%: compensate, or change fiber</span>',
},
};
let LANG = 'zh';
const t = (k, ...a) => { const v = (I18N[LANG][k] ?? I18N.zh[k]); return typeof v === 'function' ? v(...a) : (v ?? k); };

// ═══════════════════════════ 主題 / Theme ═══════════════════════════
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const C = {};
function readColors() {
  const map = { ink: '--ink', muted: '--muted', accent: '--accent', ref: '--ref', grid: '--grid', panel: '--panel' };
  for (const k in map) C[k] = css(map[k]);
}
let booted = false;
function redrawAll() { if (booted) render(); }
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('owl-theme', th); } catch (e) {}
  $('theme').textContent = th === 'dark' ? t('theme.light') : t('theme.dark');
  readColors();
  redrawAll();
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ═══════════════════════════ 語言 / Language ═══════════════════════════
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-TW';
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $('lang').textContent = LANG === 'en' ? '中文' : 'EN';
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? t('theme.light') : t('theme.dark');
  redrawAll();
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'zh';
  try { localStorage.setItem('owl-lang', LANG); } catch (e) {}
  applyLang();
}
(() => {
  let l = 'zh'; try { l = localStorage.getItem('owl-lang') || l; } catch (e) {}
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') l = q;
  LANG = l;
})();
$('lang').onclick = () => setLang(LANG === 'en' ? 'zh' : 'en');

/* ---------- 物理 ---------- */
// 熔融石英 Sellmeier（Malitson 1965），λ 用 µm
function nSilica(l) {
  const l2 = l * l;
  return Math.sqrt(1 + 0.6961663 * l2 / (l2 - 0.0684043 ** 2) + 0.4079426 * l2 / (l2 - 0.1162414 ** 2)
    + 0.8974794 * l2 / (l2 - 9.896161 ** 2));
}
// β₂ = λ³/(2πc²)·d²n/dλ²，回傳 fs²/mm（800 nm ≈ 36.2）
function beta2(lamNm) {
  const l = lamNm / 1000, h = 1e-3, c = 2.99792458e8;
  const d2 = (nSilica(l + h) - 2 * nSilica(l) + nSilica(l - h)) / (h * h);   // 1/µm²
  return (l * 1e-6) ** 3 / (2 * Math.PI * c * c) * d2 * 1e12 * 1e27;
}
// 高斯脈衝：強度 FWHM τ0 ↔ 場的 T0 = τ0 / (2√ln2)；經過 GDD φ 後 T = T0·√(1 + (φ/T0²)²)
const T0of = tau => tau / (2 * Math.sqrt(Math.LN2));
const stretch = (tau, gdd) => { const T0 = T0of(tau); return Math.sqrt(1 + (gdd / (T0 * T0)) ** 2); };
const lenMm = () => Math.pow(10, parseFloat($('len').value));

function fmtFs(v) { return v >= 10000 ? (v / 1000).toFixed(1) + ' ps' : v >= 1000 ? (v / 1000).toFixed(2) + ' ps' : v.toFixed(0) + ' fs'; }
function fmtLen(mm) { return mm >= 1000 ? (mm / 1000).toFixed(mm >= 10000 ? 0 : 2) + ' m' : mm >= 10 ? mm.toFixed(0) + ' mm' : mm.toFixed(1) + ' mm'; }
const fmtInt = v => Math.round(v).toLocaleString('en-US');

/* ---------- 顏色：瞬時頻率 → 紅…藍 ---------- */
function freqColor(x) {          // x ∈ [-1, 1]：-1 紅、+1 藍
  x = Math.max(-1, Math.min(1, x));
  const hue = 120 + 120 * x;     // 0°紅 → 120°綠 → 240°藍
  return `hsl(${hue.toFixed(0)}, 75%, 50%)`;
}

/* ---------- 脈衝圖 ---------- */
function drawPulse(tau, net) {
  const cv = $('cPulse'), ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height, mL = 14, mR = 14, mT = 30, mB = 34;
  const pw = w - mL - mR, ph = h - mT - mB;
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, w, h);
  const T0 = T0of(tau), k = stretch(tau, net), tauOut = tau * k;
  const half = 1.6 * Math.max(tau, tauOut);              // 時間視窗 ±half fs
  const X = tt => mL + pw * (tt + half) / (2 * half);
  const Y = I => mT + ph - ph * I;
  const font = (s) => `${s}px "Noto Serif TC", "Source Han Serif TC", serif`;

  // 軸
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mL, Y(0)); ctx.lineTo(w - mR, Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(0), mT); ctx.lineTo(X(0), Y(0)); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.font = font(13); ctx.fillText(t('cv.pulse'), mL, 18);
  ctx.fillStyle = C.muted; ctx.font = font(11);
  ctx.textAlign = 'center'; ctx.fillText(t('cv.time', fmtFs(half)), w / 2, h - 10); ctx.textAlign = 'left';

  // 輸出：包絡（能量守恆 → 峰值 1/k）＋依瞬時頻率上色的填色
  const D = T0 ** 4 + net * net;
  const env = tt => Math.exp(-tt * tt * T0 * T0 / D) / k;        // 強度
  const dw = tt => tt * net / D * T0;                               // 瞬時頻率偏移 × T0
  const step = 2;
  for (let px = 0; px < pw; px += step) {
    const tt = -half + 2 * half * (px + step / 2) / pw;
    const I = env(tt);
    if (I < 0.002) continue;
    ctx.fillStyle = freqColor(dw(tt) / 1.2);
    ctx.globalAlpha = 0.55;
    ctx.fillRect(mL + px, Y(I), step, Y(0) - Y(I));
  }
  ctx.globalAlpha = 1;

  // 載波（示意）：視覺頻率固定，依瞬時頻率加減，看紅前藍後
  if ($('carrier').checked) {
    const cyc = 14, Om = 2 * Math.PI * cyc / (2 * Math.max(tau, tauOut));
    ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.beginPath();
    let ph0 = 0, prev = -half;
    for (let px = 0; px <= pw; px++) {
      const tt = -half + 2 * half * px / pw;
      ph0 += Om * (1 + 0.45 * Math.max(-1.5, Math.min(1.5, dw(tt)))) * (tt - prev); prev = tt;
      // 畫在包絡內側上下擺動，不另開一條零線
      const yc = Y(env(tt) / 2) + (Y(0) - Y(env(tt))) / 2 * Math.cos(ph0) * 0.9;
      px ? ctx.lineTo(mL + px, yc) : ctx.moveTo(mL + px, yc);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // 輸出包絡線
  ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 0; px <= pw; px++) { const tt = -half + 2 * half * px / pw; const y = Y(env(tt)); px ? ctx.lineTo(mL + px, y) : ctx.moveTo(mL + px, y); }
  ctx.stroke();

  // 輸入（轉換極限）虛線
  ctx.strokeStyle = C.muted; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let px = 0; px <= pw; px++) {
    const tt = -half + 2 * half * px / pw; const y = Y(Math.exp(-tt * tt / (T0 * T0)));
    px ? ctx.lineTo(mL + px, y) : ctx.moveTo(mL + px, y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  // 圖例
  ctx.font = font(11);
  let lx = w - mR - 210, ly = 16;
  ctx.strokeStyle = C.muted; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(lx, ly - 4); ctx.lineTo(lx + 18, ly - 4); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.muted; ctx.fillText(t('cv.in'), lx + 22, ly);
  lx += 100;
  ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, ly - 4); ctx.lineTo(lx + 18, ly - 4); ctx.stroke();
  ctx.fillText(t('cv.out'), lx + 22, ly);
  // 顏色說明
  if (Math.abs(net) > 0.3 * T0 * T0) {
    ctx.fillStyle = freqColor(-1); ctx.fillText('■ ' + t('cv.red'), mL, h - 10);
    ctx.textAlign = 'right'; ctx.fillStyle = freqColor(1); ctx.fillText(t('cv.blue') + ' ■', w - mR, h - 10); ctx.textAlign = 'left';
  }
}

/* ---------- 長度曲線 ---------- */
function drawCurve(tau, b2, pre, L) {
  const cv = $('cCurve'), ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height, mL = 52, mR = 52, mT = 40, mB = 34;
  const pw = w - mL - mR, ph = h - mT - mB;
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, w, h);
  const font = (s) => `${s}px "Noto Serif TC", "Source Han Serif TC", serif`;
  const X = lg => mL + pw * lg / 4;                              // log10(mm) 0..4
  const wLo = Math.log10(Math.max(10, tau * 0.8)), wHi = Math.max(wLo + 1, Math.log10(tau * stretch(tau, b2 * 1e4) * 1.3));
  const Yw = v => mT + ph - ph * (Math.log10(v) - wLo) / (wHi - wLo);
  const Ys = s => mT + ph - ph * s;

  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.font = font(10); ctx.fillStyle = C.muted;
  for (let lg = 0; lg <= 4; lg++) {
    const x = X(lg);
    ctx.beginPath(); ctx.moveTo(x, mT); ctx.lineTo(x, mT + ph); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillText(fmtLen(10 ** lg), x, h - 18);
  }
  for (let d = Math.ceil(wLo); d <= Math.floor(wHi); d++) {
    const y = Yw(10 ** d);
    ctx.beginPath(); ctx.moveTo(mL, y); ctx.lineTo(w - mR, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = C.accent; ctx.fillText(fmtFs(10 ** d), mL - 4, y + 3);
  }
  ctx.fillStyle = C.ref; ctx.textAlign = 'left';
  for (const s of [0, 0.5, 1]) ctx.fillText((s * 100).toFixed(0) + '%', w - mR + 4, Ys(s) + 3);
  ctx.fillStyle = C.ink; ctx.font = font(13); ctx.fillText(t('cv.curve'), mL, 18);
  ctx.font = font(10); ctx.fillStyle = C.muted; ctx.fillText(t('cv.nocomp'), mL, 32);   // 放標題下一行，英文標題較長

  const line = (f, Y, color, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = dash ? 1.3 : 2; ctx.setLineDash(dash ? [4, 3] : []);
    ctx.beginPath();
    for (let px = 0; px <= pw; px++) { const lg = 4 * px / pw, y = Y(f(10 ** lg)); px ? ctx.lineTo(mL + px, y) : ctx.moveTo(mL + px, y); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  const clipW = v => Math.min(10 ** wHi, v);
  line(l => clipW(tau * stretch(tau, b2 * l)), Yw, C.accent, true);
  line(l => 1 / stretch(tau, b2 * l), Ys, C.ref, true);
  if (pre !== 0) {
    line(l => clipW(tau * stretch(tau, b2 * l + pre)), Yw, C.accent, false);
    line(l => 1 / stretch(tau, b2 * l + pre), Ys, C.ref, false);
  }
  // 目前長度
  const xl = X(Math.log10(L));
  ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(xl, mT); ctx.lineTo(xl, mT + ph); ctx.stroke(); ctx.globalAlpha = 1;
  const k = stretch(tau, b2 * L + pre);
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(xl, Yw(clipW(tau * k)), 4, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = C.ref; ctx.beginPath(); ctx.arc(xl, Ys(1 / k), 4, 0, 2 * Math.PI); ctx.fill();
  // 軸名
  ctx.save(); ctx.font = font(10);
  ctx.translate(12, mT + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillStyle = C.accent; ctx.fillText(t('cv.width'), 0, 0);
  ctx.restore(); ctx.save(); ctx.font = font(10);
  ctx.translate(w - 8, mT + ph / 2); ctx.rotate(Math.PI / 2); ctx.textAlign = 'center'; ctx.fillStyle = C.ref; ctx.fillText(t('cv.sig'), 0, 0);
  ctx.restore();
}

/* ---------- 總繪製 ---------- */
function render() {
  const tau = parseFloat($('tau').value), lam = parseFloat($('lam').value);
  const L = lenMm(), pre = parseFloat($('pre').value);
  const b2 = beta2(lam), gF = b2 * L, net = gF + pre;
  const k = stretch(tau, net);
  const T0 = T0of(tau), LD = T0 * T0 / Math.abs(b2);
  $('tauOut').textContent = tau + ' fs';
  $('lamOut').textContent = lam + ' nm';
  $('lenOut').textContent = fmtLen(L);
  $('preOut').textContent = fmtInt(pre) + ' fs²';
  drawPulse(tau, net);
  drawCurve(tau, b2, pre, L);
  const sig = 1 / k;
  $('stats').innerHTML =
    t('st.b2', b2.toFixed(1)) + '<br>' +
    t('st.gdd', fmtInt(gF), fmtInt(net)) + '<br>' +
    t('st.ld', fmtLen(LD)) + '<br>' +
    t('st.out', fmtFs(tau * k), k.toFixed(k < 10 ? 2 : 0)) + '<br>' +
    t('st.sig', (sig * 100).toFixed(sig < 0.1 ? 1 : 0) + '%') +
    (sig < 0.1 ? '<br>' + t('st.warn') : '');
}

/* ---------- 事件 ---------- */
for (const id of ['tau', 'lam', 'len', 'pre']) $(id).addEventListener('input', render);
$('carrier').addEventListener('change', render);
$('match').onclick = () => {
  const need = -beta2(parseFloat($('lam').value)) * lenMm();
  const el = $('pre');
  if (need < parseFloat(el.min)) el.min = Math.floor(need / 1000) * 1000;   // 長光纖時把滑桿範圍放寬
  el.value = need; render();
};
$('zero').onclick = () => { $('pre').value = 0; render(); };

setTheme(document.documentElement.dataset.theme || 'light');
applyLang();
booted = true;
render();
</script>
<script>
// 思源宋體（Noto Serif TC）是網路字型：載完後重畫一次 canvas，讓圖上的字也換成宋體
document.fonts && document.fonts.ready.then(() => {
  if (typeof redrawAll === 'function') redrawAll(); else if (typeof render === 'function') render();
});
</script>
</body>
